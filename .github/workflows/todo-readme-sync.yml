name: Temporary TODO README sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Update README TODO section
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          title = '### 📝 Complete TODO List'

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          py_files = git('ls-files', '*.py').splitlines()

          def todos_for(path):
              text = Path(path).read_text(encoding='utf-8')
              result = []
              for number, line in enumerate(text.splitlines(), 1):
                  match = re.search(r'#\s*TODO\b\s*(.*)$', line)
                  if not match:
                      continue
                  message = match.group(1).strip()
                  if message.startswith(':'):
                      message = message[1:].strip()
                  result.append((number, message))
              return result

          scanned = {path: todos_for(path) for path in py_files}
          print('Python files scanned:', len(py_files),
                'TODO markers:', sum(len(items) for items in scanned.values()))

          changed = set()
          diff = subprocess.run(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'],
              capture_output=True, text=True,
          )
          if diff.returncode == 0:
              changed = {
                  path for path in diff.stdout.splitlines()
                  if path.endswith('.py') and Path(path).exists()
              }
          if not changed:
              changed = {
                  'luffy/deepscaler/utils.py',
                  'luffy/verl/verl/protocol.py',
              }
          print('Changed Python files:', sorted(changed))

          text = Path('README.md').read_text(encoding='utf-8')
          lines = text.splitlines()
          title_index = lines.index(title)
          heading_index = next(
              i for i in range(title_index + 1, len(lines))
              if lines[i].startswith('## ')
          )

          entry_re = re.compile(
              r'^- \[ \] \*\*(?P<path>.+?):(?P<line>\d+)\*\* - (?P<message>.*)$'
          )
          entries = []
          for index in range(title_index + 1, heading_index):
              line = lines[index]
              if not line.strip():
                  continue
              match = entry_re.match(line)
              if not match:
                  raise SystemExit(f'Invalid TODO README line: {line!r}')
              entries.append((
                  match.group('path'),
                  int(match.group('line')),
                  len(entries),
                  match.group('message'),
              ))

          merged = [entry for entry in entries if entry[0] not in changed]
          for path in sorted(changed):
              for number, message in scanned[path]:
                  merged.append((path, number, len(merged), message))
          merged.sort(key=lambda item: (item[0], item[1], item[2]))

          old_keys = {(p, n, m) for p, n, _, m in entries}
          new_keys = {(p, n, m) for p, n, _, m in merged}
          print('Removed:', len(old_keys - new_keys))
          for item in sorted(old_keys - new_keys):
              print('  -', item)
          print('Added:', len(new_keys - old_keys))
          for item in sorted(new_keys - old_keys):
              print('  +', item)

          rendered = [
              f'- [ ] **{path}:{number}** - {message}'
              for path, number, _, message in merged
          ]
          prefix = '\n'.join(lines[:title_index + 1])
          suffix = '\n'.join(lines[heading_index:])
          output = prefix + '\n\n' + '\n'.join(rendered) + '\n\n' + suffix + '\n'
          Path('README.md').write_text(output, encoding='utf-8')
          print('TODO entries:', len(entries), '->', len(rendered))
          PY

      - name: Commit README update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet -- README.md; then
            echo "README already up to date"
          else
            git commit -m "docs: sync complete TODO list with dev code"
            git push origin HEAD:dev
          fi

      - name: Remove temporary branch
        if: always()
        shell: bash
        run: git push origin --delete tmp/readme-sync-test || true
